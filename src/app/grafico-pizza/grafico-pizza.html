@if (total > 0) {
  <div class="grafico">
    <svg viewBox="0 0 100 100">
      <g transform="rotate(-90 50 50)">
        @for (d of dados; track d.categoria; let i = $index) {
          <circle cx="50" cy="50" r="25" fill="none" stroke-width="50" pathLength="100"
            [attr.stroke]="d.cor"
            [attr.stroke-dasharray]="percentual(d) * 100 + ' ' + (100 - percentual(d) * 100)"
            [attr.stroke-dashoffset]="-inicio(i)">
            <title>{{ d.categoria }}: {{ d.total | currency: 'BRL' }}</title>
          </circle>
        }
      </g>
    </svg>

    <ul class="legenda">
      @for (d of dados; track d.categoria) {
        <li>
          <span class="marcador" [style.background]="d.cor"></span>
          <span>{{ d.categoria }}</span>
          <span class="pct">{{ percentual(d) | percent: '1.0-1' }}</span>
          <strong>{{ d.total | currency: 'BRL' }}</strong>
        </li>
      }
    </ul>
  </div>
} @else {
  <p class="vazio">Sem dados para exibir.</p>
}
